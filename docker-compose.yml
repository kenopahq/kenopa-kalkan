services:
  kalkan:
    build: .
    ports:
      - "8080:8080"
    environment:
      META_API_KEY: ${META_API_KEY:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
      KALKAN_PROVIDER: ${KALKAN_PROVIDER:-auto}
      KALKAN_SCREEN: ${KALKAN_SCREEN:-auto}
      KALKAN_SPARK_MODEL: ${KALKAN_SPARK_MODEL:-muse-spark-1.3}
      KALKAN_WONDER_MODEL: ${KALKAN_WONDER_MODEL:-muse-wonder-1.0}
    volumes:
      - kalkan-data:/app/data
    restart: unless-stopped

volumes:
  kalkan-data:
